<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Top Bunk — community icon 184×184</title>
  <link rel="stylesheet" href="capsule.css">
  <style>
    /* the face: it has to read at 184 px and in the 32 px client icon, so it is the eyes and the smile and nothing else */
    .cap { width: 184px; height: 184px; }
    .face { background: radial-gradient(circle at 50% 42%, #15161c 0%, #060607 70%); }
    .grain { opacity: 0.25; }
  </style>
</head>
<body>
  <div class="cap">
    <div class="face"><div class="eye l"></div><div class="eye r"></div><div class="smile"></div></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>
  <script src="capsule.js"></script>
</body>
</html>
