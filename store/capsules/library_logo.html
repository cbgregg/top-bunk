<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Top Bunk — library logo 1280×720 (transparent)</title>
  <link rel="stylesheet" href="../../css/fonts.css">
  <link rel="stylesheet" href="capsule.css">
  <style>
    /* transparent: only the title, with a dark halo so it reads on the hero whatever is behind it */
    html, body, .cap { background: transparent; }
    .cap { width: 1280px; height: 720px; }
    .title { left: 0; right: 0; top: 232px; text-align: center; font-size: 212px; letter-spacing: 0.14em; text-indent: 0.14em;
      text-shadow: 0 0 60px rgba(0,0,0,1), 0 0 24px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,0.9), 0 3px 3px #000; }
    .rule { left: 440px; width: 400px; top: 486px; }
  </style>
</head>
<body>
  <div class="cap">
    <div class="title">TOP BUNK</div>
    <div class="rule"></div>
  </div>
  <script src="capsule.js"></script>
</body>
</html>
