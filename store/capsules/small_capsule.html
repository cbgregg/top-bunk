<!doctype html>
<html lang="en">

  </style>
</head>
<body>
  <div class="cap">
    <img class="bg" src="src/hero_3840x1240.png" onerror="this.onerror=null;this.src='../screenshots/05_end_of_hall.png'" alt="">
    <div class="shade"></div>
    <div class="vignette"></div>
    <div class="title">TOP BUNK</div>
    <div class="grain"></div>
  </div>
  <script src="capsule.js"></script>

</html>
