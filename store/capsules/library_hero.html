<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Top Bunk — library hero 3840×1240</title>
  <link rel="stylesheet" href="capsule.css">
  <style>
    /* no text: Steam lays the library logo over this. The middle 2560 px is what every window shows; the sides are cropped on narrow ones. */
    .cap { width: 3840px; height: 1240px; }
    .cap .bg { object-position: 50% 50%; }
    .shade { background: linear-gradient(90deg, rgba(5,5,6,0.75) 0%, rgba(5,5,6,0) 22%, rgba(5,5,6,0) 78%, rgba(5,5,6,0.75) 100%), linear-gradient(0deg, rgba(5,5,6,0.6) 0%, rgba(5,5,6,0) 30%); }
    .vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.6) 100%); }
  </style>
</head>
<body>
  <div class="cap">
    <img class="bg" src="src/hero_3840x1240.png" onerror="this.onerror=null;this.src='../screenshots/05_end_of_hall.png'" alt="">
    <div class="shade"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>
  <script src="capsule.js"></script>
</body>
</html>
