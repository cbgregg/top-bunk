<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Top Bunk: page background 1438×810</title>
  <link rel="stylesheet" href="capsule.css">
  <style>
    /* Steam blurs and darkens this behind the store page; it only needs to be a mood, so: the house at night, pulled well down */
    .cap { width: 1438px; height: 810px; }
    .cap .bg { object-position: 50% 45%; filter: brightness(0.55) saturate(0.85); }
    .shade { background: linear-gradient(0deg, rgba(5,5,6,0.95) 0%, rgba(5,5,6,0.35) 40%, rgba(5,5,6,0.25) 100%); }
  </style>
</head>
<body>
  <div class="cap">
    <img class="bg" src="../screenshots/01_porch_night.png" alt="">
    <div class="shade"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>
  <script src="capsule.js"></script>
</body>
</html>
