# Desktop (Electron) builds for Steam and direct download. Independent of static.yml, which deploys the
# web version to GitHub Pages.
#
# Runs on a v* tag or by hand. Each OS builds its own electron-builder targets (the "dir" output Steam
# wants, plus zip / tar.gz for direct downloads) and uploads them as artifacts. When the Steam secrets
# exist, the "steam" job pushes the three unpacked builds to SteamPipe with game-ci/steam-deploy.
#
# Secrets:   STEAM_USERNAME, STEAM_CONFIG_VDF (steamcmd's config/config.vdf after one Steam Guard login,
#            base64-encoded: the action decodes it. Store the output of `base64 -w0 < ~/Steam/config/config.vdf`;
#            on macOS `base64 -i ~/Library/Application\ Support/Steam/config/config.vdf`. A raw paste fails the job.)
# Variables: STEAM_APP_ID (falls back to desktop/steam_appid.txt; 480 = Spacewar is refused)
name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      steam:
        description: Also upload the depots to Steam (needs the STEAM_USERNAME and STEAM_CONFIG_VDF secrets)
        type: boolean
        default: false
      steam_branch:
        description: Steam branch to set live after the upload (empty = upload only; "default" cannot be set live from CI)
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no code signing yet (see STEAM.md)

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win,   unpacked: win-unpacked }
          - { os: macos-latest,   target: mac,   unpacked: mac }            # x64 .app for Steam; mac-arm64 is built and zipped too
          - { os: ubuntu-latest,  target: linux, unpacked: linux-unpacked }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - run: npm ci

      - name: Config checks (VDF, YAML, package.json, app:// server, Steam bridge)
        run: npm run check

      - name: Smoke test (Electron under Xvfb)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          npm run smoke

      - name: Package
        run: npm run dist:${{ matrix.target }}

      - name: Depot tarball (keeps executable bits and symlinks across the artifact round trip)
        shell: bash
        run: tar -C dist -czf "dist/depot-${{ matrix.target }}.tar.gz" "${{ matrix.unpacked }}"

      - uses: actions/upload-artifact@v4
        with:
          name: top-bunk-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  gate:
    name: Steam credentials present?
    runs-on: ubuntu-latest
    outputs:
      steam: ${{ steps.check.outputs.steam }}
    steps:
      - id: check
        env:
          HAS_USER: ${{ secrets.STEAM_USERNAME != '' }}
          HAS_VDF: ${{ secrets.STEAM_CONFIG_VDF != '' }}
          WANTED: ${{ github.event_name == 'push' || inputs.steam == true }}
        run: |
          if [ "$HAS_USER" = true ] && [ "$HAS_VDF" = true ] && [ "$WANTED" = true ]; then echo "steam=true" >> "$GITHUB_OUTPUT"; else echo "steam=false" >> "$GITHUB_OUTPUT"; fi

  steam:
    name: Upload to Steam
    needs: [build, gate]
    if: needs.gate.outputs.steam == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: top-bunk-*
          path: dist
          merge-multiple: true

      - name: Unpack the depots
        run: |
          for t in win mac linux; do mkdir -p "depots/$t"; tar -xzf "dist/depot-$t.tar.gz" -C "depots/$t" --strip-components=1; done
          # steam-deploy writes its own depot scripts without steam/depot_build_*.vdf's exclusions: drop the other platforms' Steamworks binaries here
          for t in win mac linux; do
            find "depots/$t" -type d -path '*steamworks.js/dist' | while read -r d; do
              case $t in win) rm -rf "$d/osx" "$d/linux64" "$d"/win64/*.lib;; mac) rm -rf "$d/win64" "$d/linux64";; linux) rm -rf "$d/win64" "$d/osx";; esac
            done
          done
          ls -la depots/*

      - name: App ID
        id: app
        env:
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
        run: |
          id="${STEAM_APP_ID:-$(tr -d '[:space:]' < desktop/steam_appid.txt)}"
          if [ "$id" = 480 ] || ! [[ "$id" =~ ^[0-9]+$ ]]; then echo "::error::Set the STEAM_APP_ID repository variable (got '$id')"; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ steps.app.outputs.id }}
          buildDescription: ${{ github.ref_name }} (${{ github.sha }})
          rootPath: depots
          depot1Path: win      # AppID+1, Windows
          depot2Path: mac      # AppID+2, macOS
          depot3Path: linux    # AppID+3, Linux
          releaseBranch: ${{ inputs.steam_branch }}
